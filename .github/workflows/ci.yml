name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv run python decision_connector.py
      - run: uv run python bucket_delineation.py
      - run: uv run python test_call_efficiency.py
      - run: uv run python deal_scoring_adapter.py
      - run: uv run python catalog_watchdog_adapter.py
      - run: uv run python resource_triage_adapter.py
      - run: uv run python examples/resource_triage.py